<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#3d6dae" />
  <title>Notelin · 업데이트 복구</title>
  <style>
    :root{color-scheme:light dark;--bg:light-dark(#f4f6f9,#101924);--panel:light-dark(#fff,#1a2636);--text:light-dark(#25364c,#e4edf9);--muted:light-dark(#64758b,#b1bfd3);--line:light-dark(#dce4ee,#3a4d68);font:15px/1.7 "Segoe UI","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
    *{box-sizing:border-box}body{margin:0;padding:42px 22px}main{max-width:560px;margin:4vh auto;padding:34px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}header{font-size:27px;letter-spacing:-1px;font-weight:600;margin-bottom:25px}header span{color:#638fdf}h1{font-size:23px;line-height:1.4;letter-spacing:-.6px;margin:0 0 12px}p{margin:0 0 18px;color:var(--muted)}ol{padding-left:22px;margin:24px 0;color:var(--muted)}li{padding:5px 0}button{width:100%;min-height:48px;padding:10px 18px;border:0;border-radius:8px;background:#3d6dae;color:#fff;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.65;cursor:default}button:focus-visible{outline:3px solid #8fb5ed;outline-offset:3px}#status{min-height:66px;padding:15px 0 0;margin:0;font-size:14px}#status.done{color:light-dark(#286346,#a4d4b7)}details{margin-top:13px;font-size:12px;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:0;font:11px/1.6 monospace}.storage-note{border-top:1px solid var(--line);padding-top:17px;margin:14px 0 0;font-size:12px}@media(max-width:480px){body{padding:20px 15px}main{padding:26px 22px;margin:20px auto}}
  </style>
</head>
<body>
<main>
  <header>Notelin<span>.</span></header>
  <h1>업데이트 복구</h1>
  <p>앱 안에서 업데이트가 되지 않을 때 새 버전을 다시 받습니다. Notelin을 설치한 브라우저에서 열어 주세요.</p>
  <ol><li>Notelin에서 노트를 저장하고 앱을 완전히 종료하세요.</li><li>아래 버튼을 눌러 새 버전을 받으세요.</li><li>완료되면 홈 화면의 Notelin 아이콘으로 다시 여세요.</li></ol>
  <button type="button" id="repair">복구 시작</button>
  <p id="status" role="status" aria-live="polite">복구 준비가 됐어요.</p>
  <details id="details" hidden><summary>오류 상세</summary><pre id="error"></pre></details>
  <p class="storage-note">노트와 PDF 저장소를 삭제하거나 초기화하지 않습니다.</p>
</main>
<script>
(() => {
  const button = document.getElementById('repair');
  const status = document.getElementById('status');
  const base = '/mynotes/';
  async function release() {
    const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 6000);
    try {
      const response = await fetch(base + 'release.json?repair=' + Date.now(), { cache: 'no-store', signal: controller.signal });
      if (!response.ok) return;
      const data = await response.json();
      return typeof data.revision === 'string' && /^[a-zA-Z0-9_-]{7,64}$/.test(data.revision) ? data.revision : undefined;
    } catch { return; } finally { clearTimeout(timer); }
  }
  function waitForDownload(worker) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => finish(new Error('파일 다운로드가 지연되고 있어요. 인터넷 연결을 확인한 뒤 다시 시도해 주세요.')), 90000);
      function finish(error) { clearTimeout(timer); worker.removeEventListener('statechange', changed); error ? reject(error) : resolve(); }
      function changed() {
        if (['installed', 'activating', 'activated'].includes(worker.state)) finish();
        else if (worker.state === 'redundant') finish(new Error('업데이트 파일을 받지 못했어요. 네트워크를 바꾼 뒤 다시 시도해 주세요.'));
      }
      worker.addEventListener('statechange', changed); changed();
    });
  }
  button.addEventListener('click', async () => {
    button.disabled = true; button.textContent = '새 버전 받는 중…';
    document.getElementById('details').hidden = true;
    status.className = ''; status.textContent = '업데이트 파일을 확인하고 있어요…';
    try {
      if (!('serviceWorker' in navigator)) throw new Error('이 브라우저에서는 복구를 지원하지 않아요. Notelin을 설치한 브라우저에서 열어 주세요.');
      if (!navigator.onLine) throw new Error('인터넷에 연결한 뒤 다시 시도해 주세요.');
      const revision = await release();
      const url = new URL(base + 'sw.js', location.origin);
      url.searchParams.set('revision', revision || 'repair-' + Date.now());
      url.searchParams.set('recovery', String(Date.now()));
      const registration = await navigator.serviceWorker.register(url.href, { scope: base, updateViaCache: 'none' });
      status.textContent = '새 버전을 다운로드하고 있어요…';
      if (registration.installing) await waitForDownload(registration.installing);
      const finished = () => {
        status.className = 'done'; button.textContent = '새 버전 다운로드 완료';
        status.textContent = registration.waiting
          ? '새 버전을 받았어요. Notelin 앱과 다른 Notelin 웹 창을 모두 닫은 뒤, 홈 화면 아이콘으로 다시 열어 주세요.'
          : '복구가 완료됐어요. 홈 화면의 Notelin 아이콘으로 다시 열어 주세요.';
      };
      finished();
      registration.waiting?.addEventListener('statechange', finished);
      // Activation happens naturally after old app windows close. Do not force
      // an unsaved note to reload or access its database from this recovery page.
    } catch (error) {
      status.textContent = '복구를 완료하지 못했어요. 연결을 확인한 뒤 다시 시도해 주세요.';
      document.getElementById('error').textContent = String(error?.message || error) + '\n\n' + navigator.userAgent;
      document.getElementById('details').hidden = false;
      button.disabled = false; button.textContent = '다시 시도';
    }
  });
})();
</script>
</body>
</html>
