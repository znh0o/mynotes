<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta name="description" content="Notelin — S펜과 함께하는 나만의 오프라인 학습 노트" />
    <link rel="icon" type="image/png" href="%BASE_URL%notelin-flat-icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%notelin-flat-icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <script>
      // Resolve the saved appearance before styles and the app are loaded.
      let appearance = 'system';
      try { appearance = localStorage.getItem('notelin-appearance') || 'system'; } catch {}
      const dark = appearance === 'dark' || appearance !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      document.documentElement.style.backgroundColor = dark ? '#0e1624' : '#f4f7ff';
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      const ua = navigator.userAgent;
      const tablet = /iPad|Tablet|SM-[TX]/i.test(ua) || /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
      const phone = !tablet && (navigator.userAgentData?.mobile === true || /iPhone|iPod|Android.*Mobile/i.test(ua));
      const samsung = /SamsungBrowser\//.test(ua);
      manifestLink.href = '%BASE_URL%' + (phone
        ? samsung ? 'manifest-phone-samsung.webmanifest' : 'manifest-phone.webmanifest'
        : samsung ? 'manifest-samsung.webmanifest' : 'manifest.webmanifest');
      document.head.appendChild(manifestLink);
    </script>
    <title>Notelin · 나의 서재</title>
  </head>
  <body>
    <div id="app"><div class="boot">Notelin을 준비하고 있어요…</div></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
